<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대기실 · A.FECT SAJU</title>
<style>
  :root{
    --paper:#F6F2EA; --card:#FFFDF8; --ink:#221F1A; --ink-soft:#6B655B; --ink-faint:#A39C8E;
    --line:rgba(34,31,26,0.10); --accent:#3E3856; --accent-soft:#ECE9F3;
    --wood:#2FA84F; --wood-bg:#DFF3E3; --fire:#FF4136; --fire-bg:#FFE1DE;
    --earth:#E0A526; --earth-bg:#FBEECB; --metal:#7B61FF; --metal-bg:#E9E3FF;
    --water:#0074D9; --water-bg:#DCEBFA; --radius-lg:22px;
    --sp4:4px; --sp8:8px; --sp12:12px; --sp16:16px; --sp24:24px; --sp32:32px; --sp48:48px; --sp64:64px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:520px; margin:0 auto; padding:36px 20px 80px; text-align:center; }
  @media (min-width: 860px){ .wrap{ max-width:880px; } }

  .brand{ text-align:center; margin-bottom:24px; }
  .brand .mark{ font-size:14px; font-weight:700; letter-spacing:0.14em; color:var(--ink-faint); }

  .pagehead h1{ font-size:31px; font-weight:800; margin:0 0 var(--sp8); letter-spacing:-0.01em; }
  .pagehead .subcopy{ font-size:14.5px; color:var(--ink-soft); margin:0 0 var(--sp24); }

  .typetabs{ display:flex; gap:var(--sp8); overflow-x:auto; padding-bottom:2px; margin-bottom:var(--sp8); justify-content:center; scrollbar-width:none; }
  .typetabs::-webkit-scrollbar{ display:none; }
  .typetab{ flex:0 0 auto; padding:10px 18px; border-radius:999px; font-size:14px; font-weight:700;
    background:#fff; border:1px solid var(--line); color:var(--ink-soft); cursor:pointer; white-space:nowrap; }
  .typetab.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .typetab.active[data-elem="목"]{ background:var(--wood); border-color:var(--wood); }
  .typetab.active[data-elem="화"]{ background:var(--fire); border-color:var(--fire); }
  .typetab.active[data-elem="토"]{ background:var(--earth); border-color:var(--earth); }
  .typetab.active[data-elem="금"]{ background:var(--metal); border-color:var(--metal); }
  .typetab.active[data-elem="수"]{ background:var(--water); border-color:var(--water); }

  .subtypetabs{ display:none; gap:var(--sp8); margin-bottom:var(--sp8); justify-content:center; }
  .subtypetabs.show{ display:flex; }
  .subtypetab{ flex:0 0 auto; padding:8px 14px; border-radius:999px; font-size:13px; font-weight:700;
    background:var(--card); border:1px solid var(--line); color:var(--ink-soft); cursor:pointer; }
  .subtypetab.active{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }

  .typecaption{ font-size:13.5px; color:var(--ink-soft); margin:0 0 var(--sp16); min-height:19px; }

  .lobbyStage{ position:relative; width:100%; height:460px; margin-bottom:var(--sp16);
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden; }
  @media (min-width:860px){ .lobbyStage{ height:520px; } }
  .lobby-empty-msg{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    text-align:center; color:var(--ink-soft); font-size:13.5px; line-height:1.7; }
  .lobby-avatar{ position:absolute; width:104px; margin-left:-52px; margin-top:-52px;
    display:flex; flex-direction:column; align-items:center; cursor:pointer; user-select:none;
    transition:left 420ms cubic-bezier(0.22,1,0.36,1), top 420ms cubic-bezier(0.22,1,0.36,1), opacity 300ms ease, transform 200ms ease; }
  .lobby-avatar .av-circle{ width:82px; height:82px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:40px; position:relative; box-shadow:0 2px 8px rgba(34,31,26,0.08); }
  .lobby-avatar .av-name{ font-size:15.5px; font-weight:700; margin-top:var(--sp8); text-align:center; color:var(--ink); }
  .lobby-avatar .av-type{ font-size:12.5px; color:var(--ink-soft); text-align:center; }
  .lobby-avatar.selected .av-circle{ box-shadow:0 0 0 3px var(--accent), 0 2px 8px rgba(34,31,26,0.12); transform:scale(1.08); }
  .lobby-avatar .av-check{ position:absolute; top:-2px; right:-2px; width:22px; height:22px; border-radius:50%;
    background:var(--accent); color:#fff; font-size:12px; display:none; align-items:center; justify-content:center; border:2px solid var(--card); }
  .lobby-avatar.selected .av-check{ display:flex; }
  .lobby-avatar.dimmed{ opacity:0.25; }

  .joinRow{ display:flex; justify-content:center; margin-bottom:var(--sp16); }
  .joinBtnPill{ padding:12px 22px; border-radius:999px; background:#fff; border:1.5px dashed var(--ink-faint);
    color:var(--ink-soft); font-size:13.5px; font-weight:700; font-family:inherit; cursor:pointer; }

  .selectRow{ display:flex; justify-content:center; gap:var(--sp8); margin-bottom:var(--sp24); flex-wrap:wrap; }
  .selectBtn{ padding:9px 16px; border-radius:999px; background:#fff; border:1px solid var(--line);
    color:var(--ink-soft); font-size:12.5px; font-weight:700; font-family:inherit; cursor:pointer; }
  .selectBtn.primary{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }

  .playbar{ margin-bottom:var(--sp8); }
  .selectioninfo{ font-size:14px; font-weight:700; color:var(--ink-soft); margin-bottom:var(--sp16); min-height:18px; }
  .playtabs{ display:flex; gap:var(--sp8); overflow-x:auto; scrollbar-width:none; padding-bottom:4px; justify-content:center; flex-wrap:wrap; }
  .playtabs::-webkit-scrollbar{ display:none; }
  .playtab{ flex:0 0 auto; padding:12px 20px; border-radius:16px; font-size:13.5px; font-weight:700;
    background:#fff; border:1px solid var(--line); color:var(--ink); cursor:pointer; white-space:nowrap; }
  .playtab.active{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .playtab.disabled{ opacity:0.45; }
  .playtoast{ font-size:12.5px; color:var(--ink-soft); margin-top:var(--sp8); display:none; }

  #playResult{ display:none; margin-top:var(--sp64); text-align:center; }
  @media (min-width:1240px){ #playResult{ width:1200px; max-width:calc(100vw - 48px); margin-left:50%; transform:translateX(-50%); } }

  .divider{ display:flex; align-items:center; gap:var(--sp16); margin:0 0 var(--sp32); color:var(--ink-faint); }
  .divider::before, .divider::after{ content:''; flex:1; height:1px; background:var(--line); }
  .divider span{ font-size:11.5px; letter-spacing:0.12em; }

  .resulthead h2{ font-size:25px; font-weight:800; margin:0 0 var(--sp8); line-height:1.4; }
  .resulthead .lede{ font-size:14px; color:var(--ink-soft); margin:0 0 var(--sp24); }

  .capchiprow{ display:flex; justify-content:center; gap:var(--sp8); margin-bottom:14px; flex-wrap:wrap; }
  .capchip{ padding:10px 18px; border-radius:12px; font-size:13px; font-weight:700; background:#fff;
    border:1px solid var(--line); color:var(--ink-soft); cursor:pointer; }
  .capchip.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .stratrow{ display:flex; justify-content:center; gap:var(--sp8); margin-bottom:var(--sp8); flex-wrap:wrap; }
  .stratchip{ padding:9px 15px; border-radius:12px; font-size:12.5px; font-weight:700; background:#fff;
    border:1px solid var(--line); color:var(--ink-soft); cursor:pointer; }
  .stratchip.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .stratdesc{ font-size:12px; color:var(--ink-soft); margin-bottom:var(--sp16); }
  .splittoggle{ display:flex; justify-content:center; gap:var(--sp8); margin-bottom:var(--sp24); }
  .splitchip{ padding:8px 14px; border-radius:999px; font-size:12px; font-weight:700; background:#fff;
    border:1px solid var(--line); color:var(--ink-soft); cursor:pointer; }
  .splitchip.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }

  .seatsubtabs{ display:flex; gap:var(--sp8); margin-bottom:var(--sp32); justify-content:center; }
  .seatsubtab{ flex:0 1 150px; min-width:150px; height:46px; display:flex; align-items:center; justify-content:center;
    border-radius:14px; font-size:13.5px; font-weight:700;
    background:#fff; border:1px solid var(--line); color:var(--ink-soft); cursor:pointer; }
  .seatsubtab.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }

  .tables-grid{ display:grid; grid-template-columns:1fr; gap:72px 56px; justify-items:center; }
  @media (min-width:860px){ .tables-grid{ grid-template-columns:1fr 1fr; gap:72px 64px; } }
  .tables-grid.single{ grid-template-columns:1fr; }
  .tables-grid.single .table-card{ grid-column:1/-1; justify-self:center; }
  .table-card{ padding:48px 44px; background:var(--card); border:1px solid var(--line); border-radius:22px; }
  .tablabel{ text-align:center; font-size:14px; font-weight:700; color:var(--ink-soft); margin-bottom:var(--sp24); }

  .tablewrap{ position:relative; margin:0 auto; }
  .table-rect{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); border-radius:16px; background:var(--paper); }
  .seat-node{ position:absolute; display:flex; flex-direction:column; align-items:center; z-index:3; }
  .seat-node .circle{ border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(34,31,26,0.08); }
  .seat-node .label{ font-weight:700; margin-top:var(--sp8); text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); }
  .seat-node .typecap{ color:var(--ink-soft); text-align:center; }

  .connector-hit{ pointer-events:stroke; cursor:pointer; }
  .connector-dot{ cursor:pointer; animation:dotpulse 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  .connector-group:hover .connector-visible{ stroke:var(--accent) !important; stroke-width:3 !important; }
  .connector-group:hover .connector-dot{ fill:var(--accent) !important; animation:none; }
  .connector-group.pinned .connector-visible{ stroke:var(--accent) !important; stroke-width:3.5 !important; }
  .connector-group.pinned .connector-dot{ fill:var(--accent) !important; animation:none; r:8; }
  @keyframes dotpulse{ 0%,100%{ opacity:0.55; } 50%{ opacity:1; } }

  .teambalance-below{ max-width:260px; margin:var(--sp32) auto 0; text-align:center; }
  .teambalance-below .tblabel{ font-size:10.5px; font-weight:700; color:var(--ink-soft); letter-spacing:0.04em; margin-bottom:var(--sp8); }
  .teambalance-below .tbar{ display:flex; height:8px; border-radius:999px; overflow:hidden; margin-bottom:7px; }
  .teambalance-below .tbar span{ height:100%; }
  .teambalance-below .tnote{ font-size:10.5px; color:var(--ink-soft); line-height:1.5; }

  .pair-tooltip{ position:absolute; z-index:6; width:280px; background:var(--card); color:var(--ink);
    border:1px solid var(--line); border-radius:16px; padding:22px 24px; display:none; text-align:left;
    box-shadow:0 14px 32px rgba(34,31,26,0.16); pointer-events:auto; }
  @media (min-width:860px){ .pair-tooltip{ width:380px; padding:24px; } }
  .pair-tooltip.pinned{ border-color:var(--accent); box-shadow:0 16px 36px rgba(34,31,26,0.22); }
  .pair-tooltip .tt-pin-badge{ display:none; font-size:10.5px; font-weight:700; color:var(--accent); margin-bottom:var(--sp8); }
  .pair-tooltip.pinned .tt-pin-badge{ display:block; }
  .pair-tooltip .tt-names{ font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:var(--sp8); }
  .pair-tooltip .tt-headline{ font-size:17px; font-weight:700; line-height:1.5; margin-bottom:var(--sp12); }
  .pair-tooltip .tt-summary{ font-size:14.5px; color:var(--ink-soft); line-height:1.7; margin-bottom:var(--sp8); }
  .pair-tooltip .tt-toggle{ font-size:12px; font-weight:700; color:var(--accent); cursor:pointer; display:none; margin-bottom:var(--sp8); }
  .pair-tooltip.pinned .tt-toggle{ display:inline-block; }
  .pair-tooltip .tt-evidence{ display:none; font-size:13.5px; color:var(--ink-soft); line-height:1.7; border-top:1px solid var(--line); padding-top:var(--sp12); }
  .pair-tooltip .tt-close{ position:absolute; top:10px; right:12px; background:none; border:none; color:var(--ink-faint); font-size:16px; cursor:pointer; display:none; }
  .pair-tooltip.pinned .tt-close{ display:block; }

  .resultcard{ max-width:460px; margin:0 auto var(--sp24); background:var(--card); border:1px solid var(--line);
    border-radius:20px; padding:28px 26px; text-align:left; }
  .resultcard .rheadline{ font-size:18px; font-weight:700; line-height:1.55; margin-bottom:var(--sp12); }
  .resultcard .rbody{ font-size:14.5px; color:var(--ink-soft); line-height:1.7; margin-bottom:var(--sp12); }
  .rtoggle{ font-size:12.5px; color:var(--accent); font-weight:700; cursor:pointer; display:inline-block; }
  .rdetail{ display:none; font-size:13.5px; color:var(--ink-soft); line-height:1.7; margin-top:var(--sp12); padding-top:var(--sp12); border-top:1px solid var(--line); }

  .clashhead{ display:flex; align-items:center; justify-content:center; gap:var(--sp16); margin-bottom:var(--sp16); flex-wrap:wrap; }
  .clashhead .chip{ display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; }
  .clashhead .em{ font-size:30px; }
  .scoreBig{ font-size:52px; font-weight:800; color:var(--accent); line-height:1; margin-bottom:4px; }
  .scoreLabel{ font-size:12.5px; color:var(--ink-soft); font-weight:700; letter-spacing:0.04em; margin-bottom:var(--sp24); }

  .luckygrid{ display:grid; grid-template-columns:1fr; gap:var(--sp24); max-width:460px; margin:0 auto; }
  @media (min-width:640px){ .luckygrid{ grid-template-columns:1fr 1fr; } }
  .luckycard{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:28px 24px; text-align:center; }
  .luckycard .who{ font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:var(--sp12); }
  .luckycard .needchip{ display:inline-block; font-size:12px; font-weight:700; padding:6px 12px; border-radius:999px; margin-bottom:var(--sp16); }
  .luckycard .itemname{ font-size:18px; font-weight:800; margin-bottom:var(--sp8); }
  .luckycard .itemcopy{ font-size:13.5px; color:var(--ink-soft); line-height:1.7; margin-bottom:var(--sp16); }
  .luckybtn{ padding:10px 18px; border-radius:999px; background:#fff; border:1px solid var(--line);
    color:var(--ink); font-size:12.5px; font-weight:700; font-family:inherit; cursor:pointer; }

  .nextactions{ display:flex; flex-wrap:wrap; gap:var(--sp8); justify-content:center; margin-top:var(--sp8); }
  .nextbtn{ padding:11px 18px; border-radius:999px; background:#fff; border:1px solid var(--line);
    color:var(--ink); font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; }

  .overlay{ position:fixed; inset:0; background:rgba(34,31,26,0.45); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:640px){ .overlay{ align-items:center; } }
  .entrycard{ width:100%; max-width:440px; max-height:88vh; overflow-y:auto; background:var(--card);
    border-radius:24px 24px 0 0; padding:28px 24px 32px; text-align:left; }
  @media (min-width:640px){ .entrycard{ border-radius:24px; } }
  .entrycard h2{ font-size:20px; font-weight:800; margin:0 0 var(--sp8); }
  .entrycard .lede{ font-size:13.5px; color:var(--ink-soft); margin:0 0 var(--sp24); }
  .field{ margin-bottom:var(--sp24); }
  .field label{ display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:var(--sp8); }
  .field input[type="text"], .field input[type="number"], .field select{
    width:100%; height:46px; padding:0 13px; font-size:15px; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:var(--ink); font-family:inherit;
    box-sizing:border-box; appearance:none; -moz-appearance:textfield; -webkit-appearance:none; }
  .field input[type="number"]::-webkit-inner-spin-button, .field input[type="number"]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  .field select{ background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B655B' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center; background-size:16px; }
  .field select:disabled{ opacity:0.45; background-color:var(--paper); }
  .dategrid{ display:flex; gap:8px; }
  .dategrid input#mYear{ flex:1.4; } .dategrid input#mMonth, .dategrid input#mDay{ flex:1; }
  .unknown-time{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-soft); margin-top:-8px; margin-bottom:var(--sp16); cursor:pointer; }
  .unknown-time input{ margin:0; }
  .err{ font-size:12px; color:var(--fire); margin-top:6px; margin-bottom:var(--sp12); display:none; }
  .cta{ width:100%; padding:14px; background:var(--accent); color:#fff; border:none; border-radius:12px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; }
  .ghost-btn{ width:100%; padding:12px; background:transparent; color:var(--ink-soft); border:1px solid var(--line);
    border-radius:12px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; margin-top:var(--sp8); }

  .aistatus{ display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-faint); margin-top:var(--sp16); }
  .aistatus .dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-faint); }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand"><div class="mark">A.FECT SAJU</div></div>

  <div class="pagehead">
    <h1>대기실</h1>
    <p class="subcopy" id="lobbySubcopy">오늘도 다들 먼저 와 있습니다.</p>
  </div>

  <div class="typetabs" id="typeTabs"></div>
  <div class="subtypetabs" id="subTypeTabs"></div>
  <p class="typecaption" id="typeCaption"></p>

  <div class="lobbyStage" id="lobbyStage">
    <div class="lobby-empty-msg" id="lobbyEmptyMsg">아직 아무도 없어요.<br>아래에서 첫 멤버로 참여해 보세요.</div>
  </div>

  <div class="joinRow"><button class="joinBtnPill" id="joinBtn">+ 새 멤버 참여시키기</button></div>

  <div class="selectRow">
    <button class="selectBtn primary" id="selectAllBtn">전체 선택</button>
    <button class="selectBtn" id="selectTypeBtn" style="display:none;">이 타입만 선택</button>
    <button class="selectBtn" id="deselectBtn">선택 해제</button>
  </div>

  <div class="playbar">
    <div class="selectioninfo" id="selectionInfo"></div>
    <div class="playtabs" id="playTabs"></div>
    <div class="playtoast" id="playToast"></div>
  </div>

  <div id="playResult"></div>

  <div class="overlay" id="entryOverlay" style="display:none;">
    <div class="entrycard">
      <h2>참여하기</h2>
      <p class="lede">본인 정보를 입력해 주세요.</p>
      <div class="field"><label for="mNick">닉네임</label><input type="text" id="mNick" placeholder="예: 점머씨"></div>
      <div class="field"><label>생년월일</label>
        <div class="dategrid">
          <input type="number" id="mYear" placeholder="년(4자리)" inputmode="numeric">
          <input type="number" id="mMonth" placeholder="월" inputmode="numeric">
          <input type="number" id="mDay" placeholder="일" inputmode="numeric">
        </div>
      </div>
      <div class="field"><label for="mHour">태어난 시각 (시주)</label>
        <select id="mHour"><option value="" disabled selected>시간을 선택해 주세요</option></select>
      </div>
      <label class="unknown-time"><input type="checkbox" id="mUnknown"> 태어난 시각을 몰라요</label>
      <div class="err" id="addErr"></div>
      <button class="cta" id="submitEntryBtn">참여 완료</button>
      <button class="ghost-btn" id="cancelEntryBtn">취소</button>
    </div>
  </div>

</div>

<script>
// ================= Saju engine (검증된 기존 로직 재사용) =================
const STEMS = ['갑','을','병','정','무','기','경','신','임','계'];
const STEM_HANJA = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const BRANCHES = ['자','축','인','묘','진','사','오','미','신','유','술','해'];
const STEM_ELEM = ['목','목','화','화','토','토','금','금','수','수'];
const ZODIAC_EMOJI = ['🐭','🐮','🐯','🐰','🐲','🐍','🐴','🐑','🐵','🐔','🐶','🐷'];
const ELEM_EMOJI = { '목':'🌳','화':'🔥','토':'🪨','금':'⚙️','수':'💧' };
const ELEM_HANJA = { '목':'木','화':'火','토':'土','금':'金','수':'水' };
const ELEM_COLOR = { '목':'var(--wood)', '화':'var(--fire)', '토':'var(--earth)', '금':'var(--metal)', '수':'var(--water)' };
const ELEM_BG = { '목':'var(--wood-bg)', '화':'var(--fire-bg)', '토':'var(--earth-bg)', '금':'var(--metal-bg)', '수':'var(--water-bg)' };
const GENERATES = {'목':'화','화':'토','토':'금','금':'수','수':'목'};
const CONTROLS = {'목':'토','토':'수','수':'화','화':'금','금':'목'};

function jdn(y, m, d) {
  const a = Math.floor((14 - m) / 12);
  const y2 = y + 4800 - a;
  const m2 = m + 12 * a - 3;
  return d + Math.floor((153 * m2 + 2) / 5) + 365 * y2 + Math.floor(y2 / 4) - Math.floor(y2 / 100) + Math.floor(y2 / 400) - 32045;
}
function dayPillar(y, m, d) { const j = jdn(y, m, d); return { stemIdx: (j + 9) % 10, branchIdx: (j + 1) % 12 }; }
function toJulianDay(y, m, d, hourFrac) { return jdn(y, m, d) - 0.5 + hourFrac / 24; }
function solarLongitude(jd) {
  const T = (jd - 2451545.0) / 36525;
  const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  const M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
  const Mrad = M * Math.PI / 180;
  const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mrad) + (0.019993 - 0.000101 * T) * Math.sin(2 * Mrad) + 0.000289 * Math.sin(3 * Mrad);
  let lon = (L0 + C) % 360; if (lon < 0) lon += 360; return lon;
}
function findSolarTermJD(year, approxMonth, targetDeg) {
  let lo = jdn(year, approxMonth, 1) - 20, hi = jdn(year, approxMonth, 1) + 45;
  function angDiff(jd) { let diff = solarLongitude(jd) - targetDeg; if (diff > 180) diff -= 360; if (diff < -180) diff += 360; return diff; }
  for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; if (angDiff(mid) < 0) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}
function yearPillar(effectiveYear) { let diff = effectiveYear - 1984; return { stemIdx: ((diff % 10) + 10) % 10, branchIdx: ((diff % 12) + 12) % 12 }; }
const MONTH_TERMS = [
  { deg: 315, branch: 2, approxMonth: 2 },{ deg: 345, branch: 3, approxMonth: 3 },{ deg: 15, branch: 4, approxMonth: 4 },
  { deg: 45, branch: 5, approxMonth: 5 },{ deg: 75, branch: 6, approxMonth: 6 },{ deg: 105, branch: 7, approxMonth: 7 },
  { deg: 135, branch: 8, approxMonth: 8 },{ deg: 165, branch: 9, approxMonth: 9 },{ deg: 195, branch: 10, approxMonth: 10 },
  { deg: 225, branch: 11, approxMonth: 11 },{ deg: 255, branch: 0, approxMonth: 12 },{ deg: 285, branch: 1, approxMonth: 1 },
];
function getEffectiveYearAndMonthBranch(y, m, d, hourFrac) {
  const birthJD = toJulianDay(y, m, d, hourFrac);
  const termJDs = MONTH_TERMS.map(t => ({...t, jd: findSolarTermJD(y, t.approxMonth, t.deg)}));
  const sorted = [...termJDs].sort((a,b) => a.jd - b.jd);
  let monthBranch = null;
  for (let i = sorted.length - 1; i >= 0; i--) { if (birthJD >= sorted[i].jd) { monthBranch = sorted[i].branch; break; } }
  if (monthBranch === null) {
    const prevTerms = [{ deg: 255, branch: 0, approxMonth: 12 },{ deg: 285, branch: 1, approxMonth: 1 }].map(t => ({...t, jd: findSolarTermJD(y - 1, t.approxMonth, t.deg)}));
    const sortedPrev = prevTerms.sort((a,b)=>a.jd-b.jd);
    for (let i = sortedPrev.length -1; i>=0; i--) { if (birthJD >= sortedPrev[i].jd) { monthBranch = sortedPrev[i].branch; break; } }
  }
  const ipchunJD = findSolarTermJD(y, 2, 315);
  const effectiveYear = birthJD >= ipchunJD ? y : y - 1;
  return { effectiveYear, monthBranch };
}
const WOHO = { 0:2,5:2, 1:4,6:4, 2:6,7:6, 3:8,8:8, 4:0,9:0 };
function monthPillar(yearStemIdx, monthBranchIdx) { const inMonthStem = WOHO[yearStemIdx]; const offset = ((monthBranchIdx - 2) + 12) % 12; return { stemIdx: (inMonthStem + offset) % 10, branchIdx: monthBranchIdx }; }
const OSEO = { 0:0,5:0, 1:2,6:2, 2:4,7:4, 3:6,8:6, 4:8,9:8 };
function hourPillar(dayStemIdx, branchIdx) { const ziStem = OSEO[dayStemIdx]; return { stemIdx: (ziStem + branchIdx) % 10, branchIdx }; }
const HOUR_BRANCHES = [
  { branchIdx:0,  name:'자시', range:'23:00~01:00', representativeHour:0 },{ branchIdx:1,  name:'축시', range:'01:00~03:00', representativeHour:2 },
  { branchIdx:2,  name:'인시', range:'03:00~05:00', representativeHour:4 },{ branchIdx:3,  name:'묘시', range:'05:00~07:00', representativeHour:6 },
  { branchIdx:4,  name:'진시', range:'07:00~09:00', representativeHour:8 },{ branchIdx:5,  name:'사시', range:'09:00~11:00', representativeHour:10 },
  { branchIdx:6,  name:'오시', range:'11:00~13:00', representativeHour:12 },{ branchIdx:7,  name:'미시', range:'13:00~15:00', representativeHour:14 },
  { branchIdx:8,  name:'신시', range:'15:00~17:00', representativeHour:16 },{ branchIdx:9,  name:'유시', range:'17:00~19:00', representativeHour:18 },
  { branchIdx:10, name:'술시', range:'19:00~21:00', representativeHour:20 },{ branchIdx:11, name:'해시', range:'21:00~23:00', representativeHour:22 },
];
function fullSaju(y, m, d, hourBranchIdx, hasTime) {
  const representativeHour = hasTime ? HOUR_BRANCHES.find(h => h.branchIdx === hourBranchIdx).representativeHour : 12;
  const day = dayPillar(y, m, d);
  const { effectiveYear, monthBranch } = getEffectiveYearAndMonthBranch(y, m, d, representativeHour);
  const year = yearPillar(effectiveYear);
  const month = monthPillar(year.stemIdx, monthBranch);
  const hourP = hasTime ? hourPillar(day.stemIdx, hourBranchIdx) : null;
  return { year, month, day, hour: hourP };
}
const BRANCH_ELEM = ['수','토','목','목','토','화','화','토','금','금','토','수'];
function fiveElementCounts(saju) {
  const counts = { '목':0,'화':0,'토':0,'금':0,'수':0 };
  [saju.year, saju.month, saju.day, saju.hour].filter(Boolean).forEach(p => { counts[STEM_ELEM[p.stemIdx]]++; counts[BRANCH_ELEM[p.branchIdx]]++; });
  return counts;
}
function relOf(elemA, elemB) {
  if (elemA === elemB) return 'same';
  if (GENERATES[elemA] === elemB) return 'a-gen-b';
  if (GENERATES[elemB] === elemA) return 'b-gen-a';
  if (CONTROLS[elemA] === elemB) return 'a-ctl-b';
  if (CONTROLS[elemB] === elemA) return 'b-ctl-a';
  return 'none';
}
function weakestElem(counts) { return Object.entries(counts).sort((x,y)=>x[1]-y[1])[0][0]; }
function strongestElem(counts) { return Object.entries(counts).sort((x,y)=>y[1]-x[1])[0][0]; }
const TEMPERAMENT = { '목':'init', '화':'init', '토':'balance', '금':'ground', '수':'ground' };
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, Math.round(v))); }
function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function uid() { return 'm_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

// ================= 타입 라벨/카피 =================
const ELEMENTS = ['목','화','토','금','수'];
const ELEMENT_STEMS = { '목':[0,1], '화':[2,3], '토':[4,5], '금':[6,7], '수':[8,9] };
const ELEMENT_CAPTION = { '목':'일단 자라나는 사람들', '화':'가만히 있어도 온도가 있는 사람들', '토':'어쨌든 결국 정리하는 사람들', '금':'기준 하나쯤은 확실한 사람들', '수':'흐름을 읽는 사람들' };
const DAYMASTER_CAPTION = ['크게 키우는 쪽','어떻게든 자라는 쪽','일단 밝히고 보는 쪽','필요한 곳만 정확히 비추는 쪽','버티는 스케일이 큰 쪽','잘 가꾸고 은근 안 바뀌는 쪽','자를 건 자르는 쪽','디테일에 이유가 있는 쪽','판부터 크게 보는 쪽','조용히 다 스며든 쪽'];
function stemHanjaHangul(stemIdx) { const elem = STEM_ELEM[stemIdx]; return STEM_HANJA[stemIdx] + ELEM_HANJA[elem] + ' · ' + STEMS[stemIdx] + elem; }

// ================= 멤버 상태 (memberId 기준 관리, 닉네임 중복 시 자동 suffix) =================
let members = [];            // {id, nickname(base), displayName, saju, hasTime, counts}
let scatterPos = {};          // id -> {x,y}
let selected = new Set();     // Set<id>
let activeFilter = { type:'all' };
let activePlay = null;
let seatingMode = 'oksudong-elem';
let tableCapacity = 8;

function computeDisplayName(baseNickname) {
  const sameCount = members.filter(m => m.nickname === baseNickname).length;
  return sameCount === 0 ? baseNickname : `${baseNickname}(${sameCount})`;
}
function memberById(id) { return members.find(m => m.id === id); }

const lobbyStage = document.getElementById('lobbyStage');
const lobbyEmptyMsg = document.getElementById('lobbyEmptyMsg');

function stageSize() { const r = lobbyStage.getBoundingClientRect(); return { w: r.width || 400, h: r.height || 460 }; }
function randomJitteredGrid(n, w, h, marginX, marginY) {
  if (n === 0) return [];
  const cols = Math.max(1, Math.round(Math.sqrt(n * (w / h))));
  const rows = Math.ceil(n / cols);
  const cellW = (w - marginX*2) / cols, cellH = (h - marginY*2) / rows;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const jx = (Math.random() - 0.5) * cellW * 0.55, jy = (Math.random() - 0.5) * cellH * 0.55;
    const x = marginX + cellW * (col + 0.5) + jx, y = marginY + cellH * (row + 0.5) + jy;
    pts.push({ x: Math.max(marginX, Math.min(w - marginX, x)), y: Math.max(marginY, Math.min(h - marginY, y)) });
  }
  return pts;
}
function recomputeScatter() {
  const { w, h } = stageSize();
  const pts = randomJitteredGrid(members.length, w, h, 58, 62);
  scatterPos = {};
  members.forEach((m, i) => { scatterPos[m.id] = pts[i]; });
}
function clusterPositions(n, w, h) {
  if (n === 0) return [];
  const cols = Math.min(n, Math.max(2, Math.round(Math.sqrt(n))));
  const rows = Math.ceil(n / cols);
  const cellW = Math.min(118, w / (cols + 1)), cellH = Math.min(118, h / (rows + 1));
  const blockW = cellW * cols, blockH = cellH * rows;
  const startX = w/2 - blockW/2 + cellW/2, startY = h/2 - blockH/2 + cellH/2;
  const pts = [];
  for (let i = 0; i < n; i++) { const col = i % cols, row = Math.floor(i / cols); pts.push({ x: startX + col*cellW, y: startY + row*cellH }); }
  return pts;
}
function matchesFilter(mem) {
  if (activeFilter.type === 'all') return true;
  if (activeFilter.type === 'elem') return STEM_ELEM[mem.saju.day.stemIdx] === activeFilter.elem;
  if (activeFilter.type === 'dm') return mem.saju.day.stemIdx === activeFilter.stemIdx;
  return true;
}
function renderLobby() {
  lobbyEmptyMsg.style.display = members.length === 0 ? 'block' : 'none';
  lobbyStage.querySelectorAll('.lobby-avatar').forEach(n=>n.remove());
  if (members.length === 0) return;
  const { w, h } = stageSize();
  const matched = members.filter(matchesFilter);
  const cluster = clusterPositions(matched.length, w, h);
  members.forEach((mem)=>{
    const stemIdx = mem.saju.day.stemIdx, branchIdx = mem.saju.day.branchIdx;
    const node = document.createElement('div');
    node.className = 'lobby-avatar';
    node.dataset.id = mem.id;
    if (selected.has(mem.id)) node.classList.add('selected');
    const isMatch = matchesFilter(mem);
    let pos, delay = 0;
    if (activeFilter.type === 'all') { pos = scatterPos[mem.id] || { x: w/2, y: h/2 }; }
    else if (isMatch) { const idx = matched.indexOf(mem); pos = cluster[idx]; delay = idx * 35; }
    else { pos = scatterPos[mem.id] || { x: w/2, y: h/2 }; node.classList.add('dimmed'); }
    node.style.left = pos.x + 'px'; node.style.top = pos.y + 'px'; node.style.transitionDelay = delay + 'ms';
    node.innerHTML = `<div class="av-circle" style="background:${ELEM_BG[STEM_ELEM[stemIdx]]}">${ZODIAC_EMOJI[branchIdx]}<span class="av-check">✓</span></div>
      <div class="av-name">${mem.displayName}</div><div class="av-type">${stemHanjaHangul(stemIdx)}</div>`;
    node.addEventListener('click', ()=> toggleSelect(mem.id));
    lobbyStage.appendChild(node);
  });
}
function toggleSelect(id) {
  if (selected.has(id)) selected.delete(id); else selected.add(id);
  syncSelectionUI();
}
function syncSelectionUI() {
  document.querySelectorAll('.lobby-avatar').forEach(n=>{
    n.classList.toggle('selected', selected.has(n.dataset.id));
  });
  updateSelectionInfo();
  updatePlayTabsState();
}
function updateSelectionInfo() {
  const el = document.getElementById('selectionInfo');
  const n = selected.size;
  if (n === 0) el.textContent = '캐릭터를 눌러 멤버를 선택해 보세요.';
  else if (n === 1) el.textContent = `1명 선택됨 — 한 명 더 골라볼까요?`;
  else if (n === 2) el.textContent = `2명 선택됨`;
  else el.textContent = `${n}명 선택됨`;
}

document.getElementById('selectAllBtn').addEventListener('click', ()=>{ members.forEach(m=>selected.add(m.id)); syncSelectionUI(); });
document.getElementById('deselectBtn').addEventListener('click', ()=>{ selected.clear(); syncSelectionUI(); });
document.getElementById('selectTypeBtn').addEventListener('click', ()=>{ members.filter(matchesFilter).forEach(m=>selected.add(m.id)); syncSelectionUI(); });

// ================= 타입 내비게이션 =================
const typeTabsEl = document.getElementById('typeTabs');
function renderTypeTabs() {
  typeTabsEl.innerHTML = `<div class="typetab ${activeFilter.type==='all'?'active':''}" data-elem="all">전체</div>` +
    ELEMENTS.map(e=>`<div class="typetab ${activeFilter.type==='elem'&&activeFilter.elem===e?'active':''}" data-elem="${e}">${e}</div>`).join('');
  typeTabsEl.querySelectorAll('.typetab').forEach(el=>{
    el.addEventListener('click', ()=>{
      const e = el.dataset.elem;
      if (e === 'all') activeFilter = { type:'all' };
      else if (activeFilter.type==='elem' && activeFilter.elem===e) activeFilter = { type:'all' };
      else activeFilter = { type:'elem', elem:e };
      onFilterChanged();
    });
  });
}
function renderSubTypeTabs() {
  const sub = document.getElementById('subTypeTabs');
  if (activeFilter.type !== 'elem') { sub.classList.remove('show'); sub.innerHTML=''; return; }
  const stems = ELEMENT_STEMS[activeFilter.elem];
  sub.classList.add('show');
  sub.innerHTML = stems.map(si=>`<div class="subtypetab" data-stem="${si}">${STEM_HANJA[si]} ${STEMS[si]}${STEM_ELEM[si]}</div>`).join('');
  sub.querySelectorAll('.subtypetab').forEach(el=>{
    const si = Number(el.dataset.stem);
    el.classList.toggle('active', activeFilter.type==='dm' && activeFilter.stemIdx===si);
    el.addEventListener('click', ()=>{
      if (activeFilter.type==='dm' && activeFilter.stemIdx===si) activeFilter = { type:'elem', elem: STEM_ELEM[si] };
      else activeFilter = { type:'dm', stemIdx: si };
      onFilterChanged();
    });
  });
}
function renderTypeCaption() {
  const cap = document.getElementById('typeCaption');
  if (activeFilter.type === 'all') cap.textContent = '';
  else if (activeFilter.type === 'elem') cap.textContent = `${activeFilter.elem} · ${ELEMENT_CAPTION[activeFilter.elem]}`;
  else if (activeFilter.type === 'dm') cap.textContent = `${STEMS[activeFilter.stemIdx]}${STEM_ELEM[activeFilter.stemIdx]} · ${DAYMASTER_CAPTION[activeFilter.stemIdx]}`;
}
function onFilterChanged() {
  renderTypeTabs(); renderSubTypeTabs(); renderTypeCaption(); renderLobby();
  document.getElementById('selectTypeBtn').style.display = activeFilter.type==='all' ? 'none' : 'inline-block';
}

// ================= 참여(entry) 오버레이 =================
const hourSelectEl = document.getElementById('mHour');
HOUR_BRANCHES.forEach(h=>{ const opt = document.createElement('option'); opt.value = h.branchIdx; opt.textContent = `${h.name} (${h.range})`; hourSelectEl.appendChild(opt); });
document.getElementById('mUnknown').addEventListener('change', e=>{ hourSelectEl.disabled = e.target.checked; if (e.target.checked) hourSelectEl.value = ''; });
function clampDateInput(id, maxDigits, max) {
  const el = document.getElementById(id);
  el.addEventListener('input', ()=>{ let v = el.value.replace(/[^0-9]/g, '').slice(0, maxDigits); if (v !== '') { let num = Number(v); if (num > max) { num = max; v = String(num); } } el.value = v; });
}
clampDateInput('mYear', 4, 2100); clampDateInput('mMonth', 2, 12); clampDateInput('mDay', 2, 31);

const entryOverlay = document.getElementById('entryOverlay');
function resetEntryForm() {
  document.getElementById('mNick').value = ''; document.getElementById('mYear').value = '';
  document.getElementById('mMonth').value = ''; document.getElementById('mDay').value = '';
  document.getElementById('mUnknown').checked = false; hourSelectEl.disabled = false; hourSelectEl.value = '';
  document.getElementById('addErr').style.display = 'none';
}
document.getElementById('joinBtn').addEventListener('click', ()=>{ resetEntryForm(); entryOverlay.style.display = 'flex'; });
document.getElementById('cancelEntryBtn').addEventListener('click', ()=>{ entryOverlay.style.display = 'none'; });
document.getElementById('submitEntryBtn').addEventListener('click', ()=>{
  const nickname = document.getElementById('mNick').value.trim();
  const yVal = document.getElementById('mYear').value, mVal = document.getElementById('mMonth').value, dVal = document.getElementById('mDay').value;
  const unknown = document.getElementById('mUnknown').checked, hourVal = hourSelectEl.value;
  const errEl = document.getElementById('addErr');
  if (!nickname) { errEl.textContent = '닉네임을 입력해 주세요.'; errEl.style.display='block'; return; }
  if (yVal.length !== 4 || !mVal || !dVal) { errEl.textContent = '생년월일을 년(4자리)/월/일 모두 입력해 주세요.'; errEl.style.display='block'; return; }
  if (!unknown && hourVal === '') { errEl.textContent = '태어난 시각을 선택하거나 "모름"을 체크해 주세요.'; errEl.style.display='block'; return; }
  errEl.style.display = 'none';
  const y = Number(yVal), m = Number(mVal), d = Number(dVal);
  const hasTime = !unknown;
  const saju = fullSaju(y, m, d, hasTime ? Number(hourVal) : null, hasTime);
  const displayName = computeDisplayName(nickname);
  members.push({ id: uid(), nickname, displayName, saju, hasTime, counts: fiveElementCounts(saju) });
  recomputeScatter();
  entryOverlay.style.display = 'none';
  renderLobby();
});

// ================= PLAY 메뉴: 자리배치 / 행운 아이템 / 파국 조합 =================
const PLAY_ITEMS = [
  { id:'seating', title:'자리배치', minSelect:2 },
  { id:'lucky', title:'행운 아이템', minSelect:1 },
  { id:'clash', title:'파국 조합', minSelect:2 },
];
const playTabsEl = document.getElementById('playTabs');
playTabsEl.innerHTML = PLAY_ITEMS.map(p=>`<div class="playtab" data-id="${p.id}">${p.title}</div>`).join('');
playTabsEl.querySelectorAll('.playtab').forEach(el=>{ el.addEventListener('click', ()=> activatePlay(el.dataset.id)); });
function activatePlay(id) {
  const item = PLAY_ITEMS.find(p=>p.id===id);
  const toast = document.getElementById('playToast');
  if (selected.size < item.minSelect) {
    toast.style.display = 'block';
    toast.textContent = `멤버를 ${item.minSelect}명 이상 선택해 주세요.`;
    return;
  }
  toast.style.display = 'none';
  document.querySelectorAll('.playtab').forEach(t=>t.classList.toggle('active', t.dataset.id===id));
  activePlay = id;
  renderPlayResult();
}
function updatePlayTabsState() {
  playTabsEl.querySelectorAll('.playtab').forEach(el=>{
    const item = PLAY_ITEMS.find(p=>p.id===el.dataset.id);
    el.classList.toggle('disabled', selected.size < item.minSelect);
  });
  if (activePlay) {
    const item = PLAY_ITEMS.find(p=>p.id===activePlay);
    if (selected.size < item.minSelect) {
      document.getElementById('playResult').style.display = 'none';
      activePlay = null;
      document.querySelectorAll('.playtab').forEach(t=>t.classList.remove('active'));
    } else { renderPlayResult(); }
  }
}
updateSelectionInfo();
updatePlayTabsState();

function renderPlayResult() {
  const box = document.getElementById('playResult');
  box.style.display = 'block';
  box.innerHTML = '';
  const selMembers = members.filter(m=>selected.has(m.id));
  if (activePlay === 'seating') renderSeatingResult(box, selMembers);
  else if (activePlay === 'lucky') renderLuckyResult(box, selMembers);
  else if (activePlay === 'clash') renderClashResult(box, selMembers);
}

function scoreArrangement(order, mode) {
  if (order.length < 2) return 0;
  const fn = MODE_SCORERS[mode]; let total = 0;
  for (let i = 0; i < order.length; i++) total += fn(order[i], order[(i+1) % order.length]);
  return total;
}
function permute(arr) {
  if (arr.length <= 1) return [arr];
  const result = [];
  for (let i = 0; i < arr.length; i++) { const rest = arr.slice(0,i).concat(arr.slice(i+1)); permute(rest).forEach(p => result.push([arr[i], ...p])); }
  return result;
}

  return best;
}
function splitFillFirst(list, capacity) {
  const groups = []; let i = 0;

}

  const base = Math.floor(list.length / numTables), remainder = list.length % numTables;
  const groups = []; let idx = 0;
  for (let t = 0; t < numTables; t++) { const count = base + (t < remainder ? 1 : 0); groups.push(list.slice(idx, idx + count)); idx += count; }
  return groups;
}

function layoutToGrid(order, geo) {

  const topMembers = order.slice(0, topCount), bottomMembers = order.slice(topCount).reverse();
  const maxCount = Math.max(topCount, bottomCount, 1);
  const rowSpread = (maxCount - 1) * geo.seatSlot;
  const boxWidth = Math.max(rowSpread, geo.tableWidth) + geo.sidePad * 2;
  const boxHeight = geo.tableHeight + geo.seatRowGap * 2 + 64;
  const cx = boxWidth / 2, cy = boxHeight / 2;
  function rowX(i, count) { if (count === 0) return cx; const start = cx - ((count - 1) / 2) * geo.seatSlot; return start + i * geo.seatSlot; }
  const topY = cy - geo.tableHeight/2 - geo.seatRowGap, bottomY = cy + geo.tableHeight/2 + geo.seatRowGap;
  const topPos = topMembers.map((mem,i)=> ({ mem, x: rowX(i, topCount), y: topY }));
  const bottomPos = bottomMembers.map((mem,i)=> ({ mem, x: rowX(i, bottomCount), y: bottomY }));

function edgePoints(a, b, radius, gap) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const dist = Math.sqrt(dx*dx + dy*dy) || 1;
  const ux = dx / dist, uy = dy / dist;
  const off = radius + gap;
  return { ax: a.x + ux*off, ay: a.y + uy*off, bx: b.x - ux*off, by: b.y - uy*off };
}

function frictionScore(a, b) {
  const elemA = STEM_ELEM[a.saju.day.stemIdx], elemB = STEM_ELEM[b.saju.day.stemIdx];
  const rel = relOf(elemA, elemB);
  let f = 0;
  if (rel === 'a-ctl-b' || rel === 'b-ctl-a') f += 30;           // 상극 관계
  if (weakestElem(a.counts) === weakestElem(b.counts)) f += 20;   // 같은 오행이 함께 부족
  if (!(b.counts[weakestElem(a.counts)] > 0) && !(a.counts[weakestElem(b.counts)] > 0)) f += 20; // 서로 보완 없음
  if (a.saju.day.stemIdx === b.saju.day.stemIdx) f += 10;         // 동일 일간
  if (rel === 'none') f += 10;                                    // 직접 관계 없음
  return f;
}

  let worst = null, worstFriction = -1;
  for (let i=0;i<list.length;i++) for (let j=i+1;j<list.length;j++) {
    const f = frictionScore(list[i], list[j]);
    if (f > worstFriction) { worstFriction = f; worst = [list[i], list[j]]; }
  }
  return { pair: worst, friction: worstFriction };
}

  '목': { item:'작은 화분', keyword:'미니 화분 책상용', copy:'책상 위에 성장 버튼 하나. 초록 한 스푼 추가해볼까요?' },
  '화': { item:'따뜻한 무드등', keyword:'무드등 데스크', copy:'불씨가 조금 아쉽습니다. 장작 대신 조명부터 켜보죠.' },
  '토': { item:'도자기 화분', keyword:'도자기 화분 소형', copy:'흔들리는 건 화면 탭만으로 충분합니다. 책상엔 묵직한 한 점.' },
  '금': { item:'메탈 데스크 오거나이저', keyword:'메탈 데스크 정리함', copy:'머릿속 정리는 됐는데 책상이 동의하지 않는다면, 금 기운부터 물성으로 넣어봅시다.' },
  '수': { item:'미니 가습기', keyword:'미니 가습기 usb', copy:'흐르는 느낌을 책상에 살짝. 너무 거창할 필요는 없습니다.' },
};
const COMBO_ITEMS = {
  '수-화': { item:'모닥불 가습기', keyword:'모닥불 무드등 가습기', copy:'불처럼 생겼는데 물을 뿜습니다. 이 사람 사주 보고 만든 건 아닐 텐데, 결과적으로 너무 정확합니다.' },
  '목-토': { item:'작은 화분 + 도자기 받침', keyword:'화분 도자기 트레이 세트', copy:'한 명은 나무가 필요하고 한 명은 흙이 필요합니다. 화분 하나로 회의가 끝났습니다.' },
};
function comboKey(e1, e2) { return [e1,e2].sort().join('-'); }

// ================= Pinned 툴팁 상태 관리 =================
let pinnedTooltip = null;
let pinnedGroup = null;
function unpinTooltip(tooltip) {
  tooltip.dataset.pinned = '0';
  tooltip.classList.remove('pinned');
  tooltip.style.display = 'none';
  if (pinnedGroup) pinnedGroup.classList.remove('pinned');
  if (pinnedTooltip === tooltip) { pinnedTooltip = null; pinnedGroup = null; }
}
document.addEventListener('click', ()=>{ if (pinnedTooltip) unpinTooltip(pinnedTooltip); });

function attachPairTooltip(g, tooltip, tablewrap, anchorEl, mode, memA, memB) {
  function fillFallback() {
    const ctx = buildPairContext(mode, memA, memB);
    tooltip.querySelector('.tt-names').textContent = `${memA.displayName} × ${memB.displayName}`;
    tooltip.querySelector('.tt-headline').textContent = ctx.headline;
    tooltip.querySelector('.tt-summary').textContent = ctx.summary;
    tooltip.querySelector('.tt-evidence').textContent = ctx.detail;
    tooltip.querySelector('.tt-evidence').style.display = 'none';
    tooltip.querySelector('.tt-toggle').textContent = '명리로 보면 왜?';
  }
  function positionTooltip() {
    tooltip.style.display = 'block';
    const ttRect = tooltip.getBoundingClientRect(), wrapRect = tablewrap.getBoundingClientRect(), anchorRect = anchorEl.getBoundingClientRect();
    const viewportW = window.innerWidth || 375;
    const spaceRight = viewportW - anchorRect.right, spaceLeft = anchorRect.left;
    let pageLeft = (spaceRight >= ttRect.width + 16 || spaceRight >= spaceLeft) ? anchorRect.right + 14 : anchorRect.left - ttRect.width - 14;
    pageLeft = Math.max(8, Math.min(pageLeft, viewportW - ttRect.width - 8));
    tooltip.style.left = Math.round(pageLeft - wrapRect.left) + 'px';
    tooltip.style.top = Math.max(4, Math.round((anchorRect.top - wrapRect.top) + (anchorRect.height/2) - (ttRect.height/2 || 100))) + 'px';
  }
  function requestAI() {
    const analysisBasis = mode === 'oksudong-elem' ? 'five_elements' : 'day_master';
    requestAICopy('seating_pair', analysisBasis, {
      members: [
        { nickname: memA.displayName, day_master: STEMS[memA.saju.day.stemIdx]+STEM_ELEM[memA.saju.day.stemIdx], five_elements: memA.counts },
        { nickname: memB.displayName, day_master: STEMS[memB.saju.day.stemIdx]+STEM_ELEM[memB.saju.day.stemIdx], five_elements: memB.counts },
      ],
      facts: buildPairContext(mode, memA, memB),
    }, (data)=>{
      if (tooltip.style.display === 'block') {
        tooltip.querySelector('.tt-headline').textContent = data.headline;
        tooltip.querySelector('.tt-summary').textContent = data.summary || '';
        if (data.detail) tooltip.querySelector('.tt-evidence').textContent = data.detail;
      }
    });
  }
  function openTemp() { if (tooltip.dataset.pinned === '1') return; fillFallback(); positionTooltip(); requestAI(); }
  function closeTemp() { if (tooltip.dataset.pinned === '1') return; tooltip.style.display = 'none'; }
  function togglePin(e) {
    e.stopPropagation();
    if (tooltip.dataset.pinned === '1') { unpinTooltip(tooltip); return; }
    if (pinnedTooltip && pinnedTooltip !== tooltip) unpinTooltip(pinnedTooltip);
    tooltip.dataset.pinned = '1'; tooltip.classList.add('pinned'); g.classList.add('pinned');
    pinnedTooltip = tooltip; pinnedGroup = g;
    fillFallback(); positionTooltip(); requestAI();
  }
  g.addEventListener('mouseenter', openTemp);
  g.addEventListener('mouseleave', closeTemp);
  g.addEventListener('click', togglePin);
  g.addEventListener('touchstart', (e)=>{ e.preventDefault(); togglePin(e); }, { passive:false });
}

// ================= 결과: 자리배치 =================
let seatingStrategy = 'fill';
let forceSplitWhenUnderCapacity = false;

function renderSeatingResult(box, selMembers) {
  box.appendChild(sectionDivider('SEATING'));

  const head = document.createElement('div');
  head.className = 'resulthead';
  head.innerHTML = `<h2>옥수동 뉴 사무실, 자리 한번 짜볼까요?</h2>`;
  box.appendChild(head);

  const capRow = document.createElement('div');
  capRow.className = 'capchiprow';
  [4,6,8].forEach(cap=>{
    const chip = document.createElement('div');
    chip.className = 'capchip' + (tableCapacity===cap?' active':'');
    chip.textContent = cap + '인 테이블';
    chip.addEventListener('click', ()=>{ tableCapacity = cap; renderPlayResult(); });
    capRow.appendChild(chip);
  });
  box.appendChild(capRow);

  const stratRow = document.createElement('div');
  stratRow.className = 'stratrow';
  [['fill','일단 꽉 채워 앉기'],['even','사이좋게 나눠 앉기']].forEach(([id,label])=>{
    const chip = document.createElement('div');
    chip.className = 'stratchip' + (seatingStrategy===id?' active':'');
    chip.textContent = label;
    chip.addEventListener('click', ()=>{ seatingStrategy = id; renderPlayResult(); });
    stratRow.appendChild(chip);
  });
  box.appendChild(stratRow);
  const stratDesc = document.createElement('p');
  stratDesc.className = 'stratdesc';
  stratDesc.textContent = seatingStrategy === 'fill' ? '테이블 정원을 먼저 채우고, 남은 멤버는 다음 테이블로 보내요.' : '인원을 최대한 비슷하게 나눠요.';
  box.appendChild(stratDesc);

  if (seatingStrategy === 'even' && selMembers.length <= tableCapacity) {
    const splitRow = document.createElement('div');
    splitRow.className = 'splittoggle';
    [[false,'한 테이블에 앉기'],[true,'2테이블로 나누기']].forEach(([val,label])=>{
      const chip = document.createElement('div');
      chip.className = 'splitchip' + (forceSplitWhenUnderCapacity===val?' active':'');
      chip.textContent = label;
      chip.addEventListener('click', ()=>{ forceSplitWhenUnderCapacity = val; renderPlayResult(); });
      splitRow.appendChild(chip);
    });
    box.appendChild(splitRow);
  }

  const subtabs = document.createElement('div');
  subtabs.className = 'seatsubtabs';
  [['oksudong-elem','오행 기준'],['oksudong-ilgan','일간 기준']].forEach(([id,label])=>{
    const t = document.createElement('div');
    t.className = 'seatsubtab' + (seatingMode===id?' active':'');
    t.textContent = label;
    t.addEventListener('click', ()=>{ seatingMode = id; renderPlayResult(); });
    subtabs.appendChild(t);
  });
  box.appendChild(subtabs);

  const lede = document.createElement('p');
  lede.className = 'resulthead lede';
  lede.style.marginTop = '0';
  lede.textContent = MODE_INFO[seatingMode].lede;
  box.appendChild(lede);

  const groups = splitIntoTables(selMembers, tableCapacity, seatingStrategy, forceSplitWhenUnderCapacity);
  const geo = getGeo();
  const totalTables = groups.length;
  const useElemEmoji = seatingMode === 'oksudong-elem';

  const grid2 = document.createElement('div');
  grid2.className = 'tables-grid' + (totalTables === 1 ? ' single' : '');
  box.appendChild(grid2);

  groups.forEach((group, tableIndex)=>{
    if (group.length === 0) return;
    const order = bestArrangement(group, seatingMode);
    const card = document.createElement('div');
    card.className = 'table-card';
    if (totalTables > 1) {
      const lbl = document.createElement('div');
      lbl.className = 'tablabel'; lbl.textContent = `테이블 ${tableIndex+1} (${order.length}명)`;
      card.appendChild(lbl);
    }
    const grid = layoutToGrid(order, geo);
    const tablewrap = document.createElement('div');
    tablewrap.className = 'tablewrap';
    tablewrap.style.width = grid.boxWidth + 'px'; tablewrap.style.height = grid.boxHeight + 'px';

    const tableRect = document.createElement('div');
    tableRect.className = 'table-rect';
    tableRect.style.width = grid.tableWidth + 'px'; tableRect.style.height = grid.tableHeight + 'px'; tableRect.style.zIndex = '1';
    tablewrap.appendChild(tableRect);

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', grid.boxWidth); svg.setAttribute('height', grid.boxHeight);
    svg.setAttribute('viewBox', `0 0 ${grid.boxWidth} ${grid.boxHeight}`);
    svg.style.position = 'absolute'; svg.style.left = '0'; svg.style.top = '0'; svg.style.zIndex = '2';
    tablewrap.appendChild(svg);

    const svgNS = 'http://www.w3.org/2000/svg';
    buildGridConnectors(grid.topPos, grid.bottomPos).forEach((pair, ci)=>{
      const [a, b] = pair;
      const ep = edgePoints(a, b, geo.circleD/2, 10);
      const path = `M ${ep.ax} ${ep.ay} L ${ep.bx} ${ep.by}`;
      const g = document.createElementNS(svgNS, 'g'); g.classList.add('connector-group');
      const visible = document.createElementNS(svgNS, 'path');
      visible.setAttribute('d', path); visible.setAttribute('fill', 'none'); visible.setAttribute('stroke', 'var(--line)'); visible.setAttribute('stroke-width', '2');
      visible.classList.add('connector-visible'); g.appendChild(visible);
      const mid = { x:(ep.ax+ep.bx)/2, y:(ep.ay+ep.by)/2 };
      const dot = document.createElementNS(svgNS, 'circle');
      dot.setAttribute('cx', mid.x); dot.setAttribute('cy', mid.y); dot.setAttribute('r', 6); dot.setAttribute('fill', 'var(--accent)');
      dot.classList.add('connector-dot'); dot.style.animationDelay = (ci*0.3)+'s'; dot.style.pointerEvents = 'all';
      g.appendChild(dot);
      const hit = document.createElementNS(svgNS, 'path');
      hit.setAttribute('d', path); hit.setAttribute('fill', 'none'); hit.setAttribute('stroke', 'transparent'); hit.setAttribute('stroke-width', '26');
      hit.classList.add('connector-hit'); g.appendChild(hit);
      svg.appendChild(g);

      const tooltip = document.createElement('div');
      tooltip.className = 'pair-tooltip';
      tooltip.innerHTML = `<button class="tt-close">×</button><div class="tt-pin-badge">📌 고정됨</div>
        <div class="tt-names"></div><div class="tt-headline"></div><div class="tt-summary"></div>
        <div class="tt-toggle">명리로 보면 왜?</div><div class="tt-evidence"></div>`;
      tablewrap.appendChild(tooltip);
      tooltip.addEventListener('click', e=> e.stopPropagation());
      tooltip.querySelector('.tt-close').addEventListener('click', ()=> unpinTooltip(tooltip));
      tooltip.querySelector('.tt-toggle').addEventListener('click', function(){
        const ev = tooltip.querySelector('.tt-evidence');
        const open = ev.style.display === 'block';
        ev.style.display = open ? 'none' : 'block';
        this.textContent = open ? '명리로 보면 왜?' : '접기';
      });
      attachPairTooltip(g, tooltip, tablewrap, dot, seatingMode, a.mem, b.mem);
    });

    [...grid.topPos, ...grid.bottomPos].forEach(seat=>{
      const mem = seat.mem;
      const stemIdx = mem.saju.day.stemIdx, elem = STEM_ELEM[stemIdx], branchIdx = mem.saju.day.branchIdx;
      const emoji = useElemEmoji ? ELEM_EMOJI[elem] : ZODIAC_EMOJI[branchIdx];
      const node = document.createElement('div');
      node.className = 'seat-node';
      node.style.left = (seat.x - geo.circleD/2) + 'px'; node.style.top = (seat.y - geo.circleD/2) + 'px';
      node.innerHTML = `<div class="circle" style="background:${ELEM_BG[elem]}; width:${geo.circleD}px; height:${geo.circleD}px; font-size:42px;">${emoji}</div>
        <div class="label" style="font-size:15.5px; max-width:120px;">${mem.displayName}</div>
        <div class="typecap" style="font-size:13px;">${useElemEmoji ? elem : stemHanjaHangul(stemIdx)}</div>`;
      tablewrap.appendChild(node);
    });
    card.appendChild(tablewrap);

    const teamCounts = { '목':0,'화':0,'토':0,'금':0,'수':0 };
    order.forEach(m => { Object.keys(teamCounts).forEach(k => teamCounts[k] += m.counts[k]); });
    const total = Object.values(teamCounts).reduce((a,b)=>a+b,0) || 1;
    const sortedTeam = Object.entries(teamCounts).sort((a,b)=>b[1]-a[1]).filter(([k,v])=>v>0);
    const balDiv = document.createElement('div');
    balDiv.className = 'teambalance-below';
    balDiv.innerHTML = `<div class="tblabel">TEAM BALANCE</div>
      <div class="tbar">${Object.entries(teamCounts).map(([k,v])=>{ const pct=(v/total*100).toFixed(1); return v>0 ? `<span style="width:${pct}%;background:${ELEM_COLOR[k]}"></span>` : ''; }).join('')}</div>
      <div class="tnote">${sortedTeam.map(([k,v])=>`${k} ${Math.round(v/total*100)}%`).join(' · ')}</div>`;
    card.appendChild(balDiv);
    grid2.appendChild(card);
  });
}

// ================= 결과: 행운 아이템 =================
function luckyCardHTML(mem, weak) {
  const li = LUCKY_ITEMS[weak];
  return `<div class="who">${ZODIAC_EMOJI[mem.saju.day.branchIdx]} ${mem.displayName}</div>
    <div class="needchip" style="background:${ELEM_BG[weak]};color:${ELEM_COLOR[weak]}">${ELEM_EMOJI[weak]} ${weak} 부족</div>
    <div class="itemname">${li.item}</div><div class="itemcopy">${li.copy}</div>
    <button class="luckybtn">아이템 보러가기</button>`;
}
function renderLuckyResult(box, list) {
  box.appendChild(sectionDivider('LUCKY ITEM'));
  const head = document.createElement('div');
  head.className = 'resulthead';
  head.innerHTML = `<h2>행운 아이템</h2><p class="lede">부족한 오행을 채워주는 가벼운 데스크템 추천입니다.</p>`;
  box.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'luckygrid';

  if (list.length === 2) {
    const weakA = weakestElem(list[0].counts), weakB = weakestElem(list[1].counts);
    const combo = COMBO_ITEMS[comboKey(weakA, weakB)];
    if (combo) {
      const card = document.createElement('div'); card.className = 'luckycard';
      card.innerHTML = `<div class="who">${ZODIAC_EMOJI[list[0].saju.day.branchIdx]} ${list[0].displayName} · ${ZODIAC_EMOJI[list[1].saju.day.branchIdx]} ${list[1].displayName}</div>
        <div class="needchip" style="background:${ELEM_BG[weakA]};color:${ELEM_COLOR[weakA]}">${ELEM_EMOJI[weakA]}${ELEM_EMOJI[weakB]} 공동 추천</div>
        <div class="itemname">${combo.item}</div><div class="itemcopy">${combo.copy}</div>
        <button class="luckybtn">아이템 보러가기</button>`;
      box.appendChild(head);
      grid.style.gridTemplateColumns = '1fr';
      grid.appendChild(card);
      box.appendChild(grid);
      nextActionBar(box, [{ label:'파국 조합 보기', onClick: ()=> activatePlay('clash') }, { label:'자리배치 보기', onClick: ()=> activatePlay('seating') }]);
      return;
    }
  }
  list.forEach(mem=>{
    const weak = weakestElem(mem.counts);
    const card = document.createElement('div'); card.className = 'luckycard';
    card.innerHTML = luckyCardHTML(mem, weak);
    grid.appendChild(card);
  });
  box.appendChild(grid);
  nextActionBar(box, [{ label:'파국 조합 보기', onClick: ()=> activatePlay('clash') }, { label:'자리배치 보기', onClick: ()=> activatePlay('seating') }]);
}

// ================= 결과: 파국 조합 =================
function renderClashResult(box, list) {
  box.appendChild(sectionDivider('CLASH'));
  const { pair, friction } = findClashPair(list);
  const [a, b] = pair;
  const clashIndex = clamp(55 + friction * 0.5, 60, 96);
  const ctx = buildClashContext(a, b);

  const head = document.createElement('div');
  head.className = 'resulthead';
  head.innerHTML = `<h2>파국 조합</h2><p class="lede">선택한 멤버 중 사주상 마찰 요인이 가장 많은 콘텐츠용 조합입니다. "사이가 나쁘다"는 뜻은 아니에요.</p>`;
  box.appendChild(head);

  const clashHead = document.createElement('div');
  clashHead.className = 'clashhead';
  clashHead.innerHTML = `<div class="chip"><span class="em">${ZODIAC_EMOJI[a.saju.day.branchIdx]}</span>${a.displayName}</div>
    <span style="color:var(--ink-faint); font-weight:700;">×</span>
    <div class="chip"><span class="em">${ZODIAC_EMOJI[b.saju.day.branchIdx]}</span>${b.displayName}</div>`;
  box.appendChild(clashHead);

  const scoreWrap = document.createElement('div');
  scoreWrap.innerHTML = `<div class="scoreBig">${clashIndex}</div><div class="scoreLabel">파국 지수</div>`;
  box.appendChild(scoreWrap);

  const card = document.createElement('div');
  card.className = 'resultcard';
  card.innerHTML = `<div class="rheadline">${ctx.headline}</div>
    <div class="rbody">${ctx.summary}</div>
    <div class="rbody" style="font-style:italic;">${ctx.funline}</div>
    <div class="rtoggle">왜 파국이지?</div>
    <div class="rdetail">${ctx.detail}</div>`;
  card.querySelector('.rtoggle').addEventListener('click', function(){
    const d = card.querySelector('.rdetail');
    const open = d.style.display === 'block';
    d.style.display = open ? 'none' : 'block';
    this.textContent = open ? '왜 파국이지?' : '접기';
  });
  box.appendChild(card);

  requestAICopy('clash_pair', 'day_master', {
    members: [
      { nickname: a.displayName, day_master: STEMS[a.saju.day.stemIdx]+STEM_ELEM[a.saju.day.stemIdx], five_elements: a.counts },
      { nickname: b.displayName, day_master: STEMS[b.saju.day.stemIdx]+STEM_ELEM[b.saju.day.stemIdx], five_elements: b.counts },
    ],
    facts: ctx,
  }, (data)=>{
    card.querySelector('.rheadline').textContent = data.headline;
    card.querySelector('.rbody').textContent = data.summary || ctx.summary;
    if (data.detail) card.querySelector('.rdetail').textContent = data.detail;
  });

  nextActionBar(box, [{ label:'행운 아이템 보기', onClick: ()=> activatePlay('lucky') }, { label:'자리배치 보기', onClick: ()=> activatePlay('seating') }]);
}
